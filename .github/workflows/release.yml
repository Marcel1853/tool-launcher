# Baut bei jedem Push auf main den Launcher (Tauri: Rust + Weboberfläche) und
# veröffentlicht ihn in diesem Repo – aber nur, wenn es die Version aus
# src-tauri/tauri.conf.json noch nicht gibt. Release: Tag vX.Y.Z, Windows-Exe
# (portable, ohne Installation – nutzt das in Windows 10/11 eingebaute WebView2)
# und Linux-AppImage, Text = Abschnitt „## [X.Y.Z]“ aus CHANGELOG.md.
#
# Ablauf ohne Actions-Speicher (keine Artefakte, kein Cache):
#   1. Prüfen: testen, Release als Entwurf anlegen (Entwürfe sieht der Launcher nicht)
#   2. Bauen: jedes System lädt seine Datei direkt in den Entwurf hoch
#   3. Veröffentlichen: Entwurf freigeben – erst jetzt ist die Version sichtbar
# Von Hand auf einem anderen Branch gestartet wird nur gebaut, nichts veröffentlicht.
#
# Neue Version: Version in src-tauri/tauri.conf.json (und Cargo.toml,
# package.json) hochzählen, Abschnitt im CHANGELOG.md schreiben, auf main pushen.
# Eine Änderung nur an apps.json braucht keine neue Version – die Liste liest
# der Launcher direkt aus main.
name: Release

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

env:
  RELEASES_REPO: ${{ github.repository }}
  TAG_PREFIX: v
  TITEL: Tool Launcher
  DATEINAME: Tool-Launcher
  # Veröffentlicht wird nur von main aus
  VEROEFFENTLICHEN: ${{ github.ref == 'refs/heads/main' }}

jobs:
  pruefen:
    name: Prüfen
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.info.outputs.version }}
      neu: ${{ steps.gh.outputs.neu }}
    steps:
      - name: Repository auschecken
        uses: actions/checkout@v4

      # Erst testen (Rust-Teil) – schlägt ein Test fehl, wird nichts gebaut.
      - name: Linux-Bibliotheken für Tauri
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev librsvg2-dev

      - name: Rust einrichten
        uses: dtolnay/rust-toolchain@stable

      - name: Tests
        run: cd src-tauri && cargo test

      - name: Version lesen
        id: info
        run: echo "version=$(jq -r '.version' src-tauri/tauri.conf.json)" >> "$GITHUB_OUTPUT"

      - name: Release-Text aus CHANGELOG.md
        run: |
          VERSION="${{ steps.info.outputs.version }}"
          # Abschnitt „## [VERSION]“ bis zur nächsten „## [“-Überschrift
          awk -v v="$VERSION" '
            index($0, "## [" v "]") == 1 { found = 1; next }
            found && /^## \[/ { exit }
            found { print }
          ' CHANGELOG.md > release-notes.md
          [ -s release-notes.md ] || echo "Version $VERSION" > release-notes.md

      - name: Release prüfen und als Entwurf anlegen
        id: gh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if [ "$VEROEFFENTLICHEN" != "true" ]; then
            echo "Nicht auf main – nur bauen, nichts veröffentlichen."
            echo "neu=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          TAG="${TAG_PREFIX}${{ steps.info.outputs.version }}"
          if ENTWURF=$(gh release view "$TAG" --repo "$RELEASES_REPO" --json isDraft -q .isDraft 2>&1); then
            if [ "$ENTWURF" = "true" ]; then
              # Rest eines abgebrochenen Laufs: weitermachen, Dateien werden ersetzt.
              echo "$TAG liegt als Entwurf vor – Dateien werden neu hochgeladen."
              echo "neu=true" >> "$GITHUB_OUTPUT"
            else
              echo "$TAG ist schon veröffentlicht – nichts zu tun."
              echo "neu=false" >> "$GITHUB_OUTPUT"
            fi
          elif echo "$ENTWURF" | grep -qi "not found"; then
            gh release create "$TAG" --repo "$RELEASES_REPO" --draft --target "${{ github.sha }}" \
              --title "$TITEL ${{ steps.info.outputs.version }} – Entwurf, wird gebaut …" --notes-file release-notes.md
            echo "Entwurf $TAG angelegt."
            echo "neu=true" >> "$GITHUB_OUTPUT"
          else
            echo "::error::Zugriff auf $RELEASES_REPO fehlgeschlagen: $ENTWURF"
            exit 1
          fi

  bauen:
    name: Bauen (${{ matrix.os }})
    needs: pruefen
    if: needs.pruefen.outputs.neu == 'true'
    strategy:
      matrix:
        include:
          - os: windows-latest
            endung: exe
          - os: ubuntu-22.04
            endung: AppImage
    runs-on: ${{ matrix.os }}
    steps:
      - name: Repository auschecken
        uses: actions/checkout@v4

      # Ohne Cache – der würde im Actions-Speicher liegen.
      - name: Linux-Bibliotheken für Tauri
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev librsvg2-dev patchelf file

      - name: Rust einrichten
        uses: dtolnay/rust-toolchain@stable

      - name: Bauen
        shell: bash
        run: |
          VERSION="${{ needs.pruefen.outputs.version }}"
          if [ "${{ runner.os }}" = "Windows" ]; then
            # Nur die Programmdatei – portable, keine Installation
            npx --yes @tauri-apps/cli@2 build --no-bundle
            mkdir -p ausgabe
            cp src-tauri/target/release/*.exe "ausgabe/${DATEINAME}-${VERSION}.exe"
          else
            npx --yes @tauri-apps/cli@2 build --bundles appimage
            mkdir -p ausgabe
            cp src-tauri/target/release/bundle/appimage/*.AppImage "ausgabe/${DATEINAME}-${VERSION}.AppImage"
          fi
          ls -la ausgabe

      # Direkt in den Release-Entwurf statt als Artefakt zwischenzulagern
      - name: In den Release-Entwurf hochladen
        if: env.VEROEFFENTLICHEN == 'true'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release upload "${TAG_PREFIX}${{ needs.pruefen.outputs.version }}" ausgabe/*.${{ matrix.endung }} \
            --repo "$RELEASES_REPO" --clobber

  veroeffentlichen:
    name: Veröffentlichen
    needs: [pruefen, bauen]
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - name: Entwurf freigeben
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="${TAG_PREFIX}${{ needs.pruefen.outputs.version }}"
          gh release view "$TAG" --repo "$RELEASES_REPO" --json assets -q '.assets[].name'
          # Erst jetzt den richtigen Namen – solange gebaut wird, steht „Entwurf“ im Titel.
          gh release edit "$TAG" --repo "$RELEASES_REPO" --title "$TITEL ${{ needs.pruefen.outputs.version }}" --draft=false --latest
